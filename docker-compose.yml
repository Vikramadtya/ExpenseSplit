services:
  expensesplit-postgres:
    image: postgres:16-alpine
    container_name: expensesplit-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: expensesplit
    volumes:
      - expensesplit_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    ports:
      - "5433:5432"

volumes:
  expensesplit_postgres_data: