openapi: 3.0.3
info:
  title: ExpenseSplit API
  description: Multi-tenant SaaS API for expense splitting and debt simplification.
  version: 2.0.0
servers:
- url: /api/v1
  description: Main API
components:
  securitySchemes:
    bearerAuth:
      type: apiKey
      in: cookie
      name: session
  schemas:
    ProblemDetail:
      type: object
      required:
      - type
      - title
      - status
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
          format: uri
        requestId:
          type: string
        traceId:
          type: string
    User:
      type: object
      required:
      - id
      - email
      - name
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        avatarUrl:
          type: string
          format: uri
          nullable: true
        upiVpa:
          type: string
          nullable: true
        paypalMe:
          type: string
          nullable: true
        venmoHandle:
          type: string
          nullable: true
    Workspace:
      type: object
      required:
      - id
      - name
      - defaultCurrency
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        defaultCurrency:
          type: string
          example: USD
        type:
          type: string
          enum: [GROUP, DIRECT]
          description: DIRECT is the private ledger between two friends
        createdAt:
          type: string
          format: date-time
    Comment:
      type: object
      required: [id, expenseId, userId, body, createdAt]
      properties:
        id:
          type: string
          format: uuid
        expenseId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        body:
          type: string
        createdAt:
          type: string
          format: date-time
        user:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            avatarUrl:
              type: string
              nullable: true
    Notification:
      type: object
      required: [id, kind, createdAt, message]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
        workspaceId:
          type: string
          format: uuid
          nullable: true
        payload:
          type: object
          additionalProperties: true
        readAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        message:
          type: object
          required: [title, body]
          properties:
            title:
              type: string
            body:
              type: string
    RecurringRule:
      type: object
      required: [id, workspaceId, interval, nextRunAt, active, template]
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        interval:
          type: string
          enum: [DAILY, WEEKLY, MONTHLY]
        nextRunAt:
          type: string
          format: date-time
        runCount:
          type: integer
        active:
          type: boolean
        lastError:
          type: string
          nullable: true
        template:
          type: object
          properties:
            description:
              type: string
            amount:
              type: number
            currency:
              type: string
    Receipt:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [PROCESSING, DONE, FAILED]
        error:
          type: string
          nullable: true
        result:
          type: object
          nullable: true
          properties:
            merchant:
              type: string
              nullable: true
            date:
              type: string
              nullable: true
            currency:
              type: string
              nullable: true
            items:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                  amount:
                    type: number
            tax:
              type: number
            tip:
              type: number
            total:
              type: number
            mismatch:
              type: boolean
            suggestedCategory:
              type: string
    Category:
      type: object
      required: [id, name, icon, parentId, expenseCount, locked]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        icon:
          type: string
        parentId:
          type: string
          format: uuid
          nullable: true
        expenseCount:
          type: integer
        locked:
          type: boolean
          description: The fallback category, which cannot be renamed, moved or deleted
    CategoryRow:
      type: object
      required: [id, name, icon, parentId]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        icon:
          type: string
        parentId:
          type: string
          format: uuid
          nullable: true
    Budget:
      type: object
      required: [id, category, currency, amount, spent, percent]
      properties:
        id:
          type: string
          format: uuid
        category:
          type: string
        currency:
          type: string
        amount:
          type: number
        spent:
          type: number
          description: Spent this month
        percent:
          type: integer
    Expense:
      type: object
      required:
      - id
      - workspaceId
      - description
      - amount
      - date
      - splitType
      - paidBy
      - createdAt
      - category
      - currency
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        description:
          type: string
        amount:
          type: number
          format: float
        date:
          type: string
          format: date-time
        splitType:
          type: string
          enum:
          - EQUAL
          - EXACT
          - PERCENTAGE
          - SHARES
          - ITEMIZED
        paidBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        splits:
          type: array
          items:
            $ref: '#/components/schemas/ExpenseSplit'
        category:
          type: string
        currency:
          type: string
          default: USD
        version:
          type: integer
          description: Increments on every edit; send back as expectedVersion to detect conflicts
        type:
          type: string
          enum:
          - EXPENSE
          - TRANSFER
          default: EXPENSE
        tags:
          type: array
          items:
            type: string
        recurringInterval:
          type: string
          enum:
          - NONE
          - DAILY
          - WEEKLY
          - MONTHLY
          default: NONE
    ExpenseSplit:
      type: object
      required:
      - id
      - userId
      - amountOwed
      - amountPaid
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        amountOwed:
          type: number
          format: float
        amountPaid:
          type: number
          format: float
    Settlement:
      type: object
      required:
      - id
      - workspaceId
      - payerId
      - payeeId
      - amount
      - date
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        payerId:
          type: string
          format: uuid
        payeeId:
          type: string
          format: uuid
        amount:
          type: number
          format: float
        date:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    Balance:
      type: object
      required:
      - byCurrency
      properties:
        converted:
          type: object
          description: Present when convertTo was requested
          properties:
            currency:
              type: string
            owedToYou:
              type: number
            youOwe:
              type: number
        byCurrency:
          type: array
          items:
            type: object
            required:
            - currency
            - total
            - owedToYou
            - youOwe
            - perMember
            properties:
              currency:
                type: string
              total:
                type: number
              owedToYou:
                type: number
              youOwe:
                type: number
              perMember:
                type: array
                items:
                  type: object
                  required:
                  - userId
                  - net
                  properties:
                    userId:
                      type: string
                      format: uuid
                    net:
                      type: number
    SimplifiedDebt:
      type: object
      required:
      - debtor
      - creditor
      - amount
      - currency
      properties:
        debtor:
          type: string
          format: uuid
        creditor:
          type: string
          format: uuid
        amount:
          type: number
        currency:
          type: string
    Analytics:
      type: object
      required:
      - byCurrency
      properties:
        byCurrency:
          type: array
          items:
            type: object
            required:
            - currency
            - totalSpend
            - expenseCount
            - spendByMember
            - spendOverTime
            - topCategories
            - trueSpending
            - cashOut
            - received
            - paid
            - todaySpend
            - thisMonthSpend
            properties:
              currency:
                type: string
              totalSpend:
                type: number
              expenseCount:
                type: integer
              spendByMember:
                type: array
                items:
                  type: object
                  required:
                  - userId
                  - name
                  - amount
                  properties:
                    userId:
                      type: string
                      format: uuid
                    name:
                      type: string
                    amount:
                      type: number
              spendOverTime:
                type: array
                items:
                  type: object
                  required:
                  - date
                  - amount
                  properties:
                    date:
                      type: string
                      format: date
                    amount:
                      type: number
              topCategories:
                type: array
                items:
                  type: object
                  required:
                  - description
                  - count
                  - total
                  properties:
                    description:
                      type: string
                    count:
                      type: integer
                    total:
                      type: number
              trueSpending:
                type: number
              cashOut:
                type: number
              received:
                type: number
              paid:
                type: number
              todaySpend:
                type: number
              thisMonthSpend:
                type: number
              lastMonthSpend:
                type: number
              monthOverMonthChange:
                type: number
                nullable: true
                description: Percent change of this month's spending against last month's
              averageExpense:
                type: number
              previousPeriodSpend:
                type: number
                nullable: true
                description: Spending in the same-length window just before the chosen period (null for all time)
              changeVsPrevious:
                type: number
                nullable: true
                description: Percent change against that previous window
              biggestExpenses:
                type: array
                items:
                  type: object
                  required: [id, description, category, date, amount]
                  properties:
                    id:
                      type: string
                    description:
                      type: string
                    category:
                      type: string
                    date:
                      type: string
                    amount:
                      type: number
              yourShareByCategory:
                type: array
                items:
                  type: object
                  required: [category, total]
                  properties:
                    category:
                      type: string
                    total:
                      type: number
              tagsAnalysis:
                type: array
                items:
                  type: object
                  properties:
                    tag:
                      type: string
                    total:
                      type: number
    PayerInfo:
      type: object
      required:
      - userId
      - amount
      properties:
        userId:
          type: string
          format: uuid
        amount:
          type: number
          format: float
    CreateExpenseDto:
      type: object
      required:
      - description
      - amount
      - date
      - splitType
      - groupId
      - payers
      properties:
        description:
          type: string
        amount:
          type: number
        date:
          type: string
          format: date-time
        splitType:
          type: string
          enum:
          - EQUAL
          - EXACT
          - PERCENTAGE
          - SHARES
          - ITEMIZED
        groupId:
          type: string
          format: uuid
        category:
          type: string
        currency:
          type: string
          default: USD
        type:
          type: string
          enum:
          - EXPENSE
          - TRANSFER
          default: EXPENSE
        tags:
          type: array
          items:
            type: string
        recurringInterval:
          type: string
          enum:
          - NONE
          - DAILY
          - WEEKLY
          - MONTHLY
          default: NONE
        payers:
          type: array
          items:
            $ref: '#/components/schemas/PayerInfo'
        exactAmounts:
          type: array
          items:
            type: object
            properties:
              userId:
                type: string
                format: uuid
              amount:
                type: number
        percentages:
          type: array
          items:
            type: object
            properties:
              userId:
                type: string
                format: uuid
              percentage:
                type: number
    CreateSettlementDto:
      type: object
      required:
      - payeeId
      properties:
        payeeId:
          type: string
          format: uuid
        amount:
          type: number
          description: Optional custom amount. If omitted, settles the entire debt.
        date:
          type: string
          format: date-time
security:
- bearerAuth: []
paths:

  /workspaces/{workspaceId}/members/{userId}:
    delete:
      summary: Remove a member
      tags:
      - Workspaces
      operationId: removeMember
      parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: No Content
  /settlements/global:
    post:
      summary: Record a global cross-workspace settlement
      tags:
      - Settlements
      operationId: createGlobalSettlement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - payeeId
              - amount
              properties:
                payeeId:
                  type: string
                  format: uuid
                amount:
                  type: number
                currency:
                  type: string
      responses:
        '201':
          description: Created
  /users/me:
    get:
      summary: Get current authenticated user
      operationId: getCurrentUser
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
    patch:
      summary: Update your profile and payment handles (null clears a handle)
      operationId: updateCurrentUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                upiVpa:
                  type: string
                  nullable: true
                paypalMe:
                  type: string
                  nullable: true
                venmoHandle:
                  type: string
                  nullable: true
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
  /payment-links:
    get:
      summary: Deep links for paying someone with the apps they accept
      operationId: getPaymentLinks
      parameters:
      - name: payeeId
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: amount
        in: query
        required: true
        schema:
          type: number
      - name: currency
        in: query
        required: true
        schema:
          type: string
      - name: note
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Links for the payee's saved payment apps
          content:
            application/json:
              schema:
                type: object
                required: [payee, links]
                properties:
                  payee:
                    type: object
                    required: [id, name]
                    properties:
                      id:
                        type: string
                        format: uuid
                      name:
                        type: string
                  links:
                    type: array
                    items:
                      type: object
                      required: [method, label, url]
                      properties:
                        method:
                          type: string
                          enum: [UPI, PAYPAL, VENMO]
                        label:
                          type: string
                        url:
                          type: string
  /currencies:
    get:
      summary: Supported ISO 4217 currencies with their decimal places
      operationId: listCurrencies
      responses:
        '200':
          description: Currencies sorted by code
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [code, name, symbol, exponent]
                  properties:
                    code:
                      type: string
                      example: JPY
                    name:
                      type: string
                      example: Japanese Yen
                    symbol:
                      type: string
                      example: ¥
                    exponent:
                      type: integer
                      description: Decimal places in the minor unit (0 for yen, 2 for dollars, 3 for dinars)
  /fx/rates:
    get:
      summary: Latest exchange rates for a base currency
      operationId: getFxRates
      parameters:
      - name: base
        in: query
        schema:
          type: string
          default: USD
      responses:
        '200':
          description: Rates keyed by currency code
          content:
            application/json:
              schema:
                type: object
                required: [base, date, rates]
                properties:
                  base:
                    type: string
                  date:
                    type: string
                  rates:
                    type: object
                    additionalProperties:
                      type: number
  /users/{userId}:
    get:
      summary: Get a user by ID
      operationId: getUserById
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: User object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
  /workspaces:
    get:
      summary: List workspaces for current user
      operationId: getWorkspaces
      responses:
        '200':
          description: A list of workspaces
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Workspace'
    post:
      summary: Create a new workspace
      operationId: createWorkspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                name:
                  type: string
                defaultCurrency:
                  type: string
                  default: USD
      responses:
        '201':
          description: Workspace created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
  /workspaces/{workspaceId}:
    get:
      summary: Get workspace details
      tags:
      - Workspaces
      operationId: getWorkspace
      parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
    patch:
      summary: Update workspace
      tags:
      - Workspaces
      operationId: updateWorkspace
      parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                defaultCurrency:
                  type: string
      responses:
        '200':
          description: OK
    delete:
      summary: Delete workspace
      tags:
      - Workspaces
      operationId: deleteWorkspace
      parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: No Content
  /workspaces/{workspaceId}/members:
    get:
      summary: List members of a workspace
      operationId: getWorkspaceMembers
      parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: A list of members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
    post:
      summary: Invite a user to a workspace by email
      operationId: inviteMember
      parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        '201':
          description: User invited
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
  /workspaces/{workspaceId}/expenses:
    get:
      summary: List expenses in a workspace
      operationId: listWorkspaceExpenses
      parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: search
        in: query
        schema:
          type: string
      - name: q
        in: query
        schema:
          type: string
      - name: currency
        in: query
        schema:
          type: string
      - name: category
        in: query
        schema:
          type: string
      - name: sortBy
        in: query
        schema:
          type: string
      - name: tags
        in: query
        description: Comma-separated; matches expenses having any of the tags
        schema:
          type: string
      - name: from
        in: query
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        schema:
          type: string
          format: date-time
      - name: cursor
        in: query
        description: Value of the `x-next-cursor` header from the previous page
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      responses:
        '200':
          description: One page of expenses, newest first
          headers:
            x-next-cursor:
              description: Present when more pages exist
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Expense'
    post:
      summary: Add a new expense to a workspace
      operationId: createExpense
      parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - description
              - amount
              - date
              - splitType
              - paidBy
              - participants
              - category
              - currency
              properties:
                description:
                  type: string
                amount:
                  type: number
                  format: float
                date:
                  type: string
                  format: date-time
                splitType:
                  type: string
                  enum:
                  - EQUAL
                  - EXACT
                  - PERCENTAGE
                  - SHARES
                  - ITEMIZED
                  default: EQUAL
                payers:
                  type: array
                  items:
                    type: object
                    required: [userId, amount]
                    properties:
                      userId:
                        type: string
                        format: uuid
                      amount:
                        type: number
                        format: float
                participants:
                  type: array
                  items:
                    type: string
                    format: uuid
                tags:
                  type: array
                  items:
                    type: string
                type:
                  type: string
                  enum: [EXPENSE, TRANSFER]
                  default: EXPENSE
                recurringInterval:
                  type: string
                  enum: [NONE, DAILY, WEEKLY, MONTHLY]
                  default: NONE
                exactAmounts:
                  type: array
                  items:
                    type: object
                    required:
                    - userId
                    - amount
                    properties:
                      userId:
                        type: string
                        format: uuid
                      amount:
                        type: number
                percentages:
                  type: array
                  items:
                    type: object
                    required:
                    - userId
                    - percentage
                    properties:
                      userId:
                        type: string
                        format: uuid
                      percentage:
                        type: number
                shares:
                  type: array
                  items:
                    type: object
                    required:
                    - userId
                    - shares
                    properties:
                      userId:
                        type: string
                        format: uuid
                      shares:
                        type: number
                category:
                  type: string
                  description: One of the built-in categories; unknown values become Other
                items:
                  type: array
                  description: ITEMIZED only. Each line is split between its assignees.
                  items:
                    type: object
