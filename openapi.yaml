  /expenses/{expenseId}:
    get:
      summary: Get expense by ID
      operationId: getExpense
      parameters:
      - name: expenseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Expense object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expense'
    patch:
      summary: Update an expense
      operationId: updateExpense
      parameters:
      - name: expenseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                description:
                  type: string
                amount:
                  type: number
                date:
                  type: string
                  format: date-time
                splitType:
                  type: string
                  enum:
                  - EQUAL
                  - EXACT
                  - PERCENTAGE
                  - SHARES
                  - ITEMIZED
                payers:
                  type: array
                  items:
                    type: object
                    required: [userId, amount]
                    properties:
                      userId:
                        type: string
                        format: uuid
                      amount:
                        type: number
                        format: float
                expectedVersion:
                  type: integer
                  description: Fails with 409 if the expense has changed since this version
                paidBy:
                  type: string
                  format: uuid
                shares:
                  type: array
                  items:
                    type: object
                    required:
                    - userId
                    - shares
                    properties:
                      userId:
                        type: string
                        format: uuid
                      shares:
                        type: number
                participants:
                  type: array
                  items:
                    type: string
                    format: uuid
                tags:
                  type: array
                  items:
                    type: string
                type:
                  type: string
                  enum: [EXPENSE, TRANSFER]
                  default: EXPENSE
                recurringInterval:
                  type: string
                  enum: [NONE, DAILY, WEEKLY, MONTHLY]
                  default: NONE
                exactAmounts:
                  type: array
                  items:
                    type: object
                    properties:
                      userId:
                        type: string
                        format: uuid
                      amount:
                        type: number
                category:
                  type: string
                percentages:
                  type: array
                  items:
                    type: object
                    properties:
                      userId:
                        type: string
                        format: uuid
                      percentage:
                        type: number
                currency:
                  type: string
      responses:
        '200':
          description: Updated expense
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expense'
    delete:
      summary: Delete an expense
      operationId: deleteExpense
      parameters:
      - name: expenseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Deleted
